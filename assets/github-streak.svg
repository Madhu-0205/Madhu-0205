<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 165" width="1000" height="165" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050A14"/>
      <stop offset="50%" stop-color="#07111F"/>
      <stop offset="100%" stop-color="#0B162C"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0D192E" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#081020" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="streakGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(56, 189, 248, 0.035)" stroke-width="1"/>
    </pattern>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'SF Mono', Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif; }
  </style>

  <rect width="1000" height="165" rx="14" fill="url(#bgGrad)"/>
  <rect width="1000" height="165" rx="14" fill="url(#grid)"/>
  <rect width="1000" height="165" rx="14" stroke="#38BDF8" stroke-width="1" fill="none">
    <animate attributeName="stroke-opacity" values="0.15;0.35;0.15" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- Section Header -->
  <g>
    <text x="24" y="26" class="mono" font-size="10" font-weight="600" fill="#38BDF8" letter-spacing="1.5">// COMMIT CONSISTENCY &amp; CONTINUITY • Madhu-0205</text>
    <text x="24" y="46" class="sans" font-size="17" font-weight="800" fill="#F8FAFC" letter-spacing="0.5">GITHUB STREAK</text>
    <path d="M 24 53 L 155 53" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
    <path d="M 163 53 L 976 53" stroke="rgba(56, 189, 248, 0.15)" stroke-width="1" stroke-dasharray="3 3">
      <animate attributeName="stroke-dashoffset" from="0" to="24" dur="4s" repeatCount="indefinite"/>
    </path>
    <line x1="163" y1="53" x2="295" y2="53" stroke="url(#beamGrad)" stroke-width="2">
      <animate attributeName="x1" values="163;840;163" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="295;972;295" dur="8s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Panel 1: Total Contributions -->
  <g opacity="0" transform="translate(24, 72)">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.15s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="24 72" to="24 64" dur="0.4s" begin="0.15s" fill="freeze"/>

    <rect width="304" height="85" rx="8" fill="url(#cardGrad)" stroke="#10B981" stroke-width="1">
      <animate attributeName="stroke-opacity" values="0.25;0.65;0.25" dur="3.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="0" y="0" width="304" height="2" fill="#10B981" rx="1"/>
    
    <circle cx="26" cy="28" r="12" fill="rgba(16, 185, 129, 0.12)" stroke="#10B981" stroke-width="1">
      <animate attributeName="stroke-opacity" values="0.4;0.9;0.4" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <path d="M 20 28 L 24 32 L 32 24" fill="none" stroke="#10B981" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    
    <text x="48" y="22" class="mono" font-size="9.5" fill="#94A3B8" letter-spacing="0.5">TOTAL CONTRIBUTIONS</text>
    
    <!-- Number reveal -->
    <text x="48" y="48" class="mono" font-size="24" font-weight="800" fill="#F8FAFC" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.3s" fill="freeze"/>
      295
    </text>
    <text x="48" y="68" class="mono" font-size="8.5" fill="#10B981">Sep 28, 2025 – Present Year</text>
    
    <!-- Mini activity dot -->
    <circle cx="288" cy="20" r="2.5" fill="#10B981">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Panel 2: Current Streak (Centerpiece with self-drawing ring & pulsing flame) -->
  <g opacity="0" transform="translate(348, 72)">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.3s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="348 72" to="348 64" dur="0.4s" begin="0.3s" fill="freeze"/>

    <rect width="304" height="85" rx="8" fill="url(#cardGrad)" stroke="#F59E0B" stroke-width="1.2">
      <animate attributeName="stroke-opacity" values="0.35;0.8;0.35" dur="3s" repeatCount="indefinite"/>
    </rect>
    <rect x="0" y="0" width="304" height="2" fill="url(#streakGlow)" rx="1"/>
    
    <!-- Flame icon with pulsing glow -->
    <g>
      <circle cx="26" cy="28" r="12" fill="rgba(245, 158, 11, 0.15)" stroke="#F59E0B" stroke-width="1">
        <animate attributeName="stroke-opacity" values="0.4;0.95;0.4" dur="2.2s" repeatCount="indefinite"/>
        <animate attributeName="r" values="12;13.2;12" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <path d="M 26 20 C 26 20 22 25 22 28 C 22 30.2 23.8 32 26 32 C 28.2 32 30 30.2 30 28 C 30 25 26 20 26 20 Z" fill="#F59E0B">
        <animate attributeName="opacity" values="0.75;1;0.75" dur="1.8s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="scale" values="1 1; 1.08 1.08; 1 1" dur="1.8s" repeatCount="indefinite" transform-origin="26 28"/>
      </path>
    </g>
    
    <!-- Streak Telemetry Arc (Draws itself on load) -->
    <g transform="translate(254, 42)">
      <circle cx="0" cy="0" r="20" fill="none" stroke="rgba(245, 158, 11, 0.15)" stroke-width="3"/>
      <circle cx="0" cy="0" r="20" fill="none" stroke="url(#streakGlow)" stroke-width="3" stroke-linecap="round"
              stroke-dasharray="125" stroke-dashoffset="125" transform="rotate(-90 0 0)">
        <animate attributeName="stroke-dashoffset" from="125" to="32" dur="1.2s" begin="0.45s" fill="freeze"/>
      </circle>
      <circle cx="0" cy="0" r="2" fill="#F59E0B">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite"/>
      </circle>
    </g>

    <text x="48" y="22" class="mono" font-size="9.5" fill="#F59E0B" letter-spacing="0.5">CURRENT STREAK (LIVE)</text>
    
    <!-- Streak reveal -->
    <text x="48" y="48" class="mono" font-size="24" font-weight="800" fill="#F59E0B" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.45s" fill="freeze"/>
      12 DAYS
    </text>
    <text x="48" y="68" class="mono" font-size="8.5" fill="#CBD5E1">Sep 21, 2026 – Oct 02, 2026 (Active)</text>
  </g>

  <!-- Panel 3: Longest Streak -->
  <g opacity="0" transform="translate(672, 72)">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.45s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="672 72" to="672 64" dur="0.4s" begin="0.45s" fill="freeze"/>

    <rect width="304" height="85" rx="8" fill="url(#cardGrad)" stroke="#8B5CF6" stroke-width="1">
      <animate attributeName="stroke-opacity" values="0.25;0.65;0.25" dur="4s" repeatCount="indefinite"/>
    </rect>
    <rect x="0" y="0" width="304" height="2" fill="#8B5CF6" rx="1"/>
    
    <circle cx="26" cy="28" r="12" fill="rgba(139, 92, 246, 0.12)" stroke="#8B5CF6" stroke-width="1">
      <animate attributeName="stroke-opacity" values="0.4;0.9;0.4" dur="3s" repeatCount="indefinite"/>
    </circle>
    <path d="M 20 22 H 32 V 27 C 32 30.3 29.3 33 26 33 C 22.7 33 20 30.3 20 27 Z M 22 33 L 21 36 H 31 L 30 33" fill="none" stroke="#8B5CF6" stroke-width="1.4"/>
    
    <text x="48" y="22" class="mono" font-size="9.5" fill="#94A3B8" letter-spacing="0.5">LONGEST STREAK</text>
    
    <!-- Number reveal -->
    <text x="48" y="48" class="mono" font-size="24" font-weight="800" fill="#F8FAFC" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.6s" fill="freeze"/>
      12 DAYS
    </text>
    <text x="48" y="68" class="mono" font-size="8.5" fill="#8B5CF6">Peak Sustained Consistency</text>
    
    <!-- Mini activity dot -->
    <circle cx="288" cy="20" r="2.5" fill="#8B5CF6">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>