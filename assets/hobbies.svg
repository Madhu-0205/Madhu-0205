<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 230" width="1000" height="230" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050A14"/>
      <stop offset="50%" stop-color="#07111F"/>
      <stop offset="100%" stop-color="#0B162C"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0D192E" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#081020" stop-opacity="0.96"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(56, 189, 248, 0.035)" stroke-width="1"/>
    </pattern>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'SF Mono', Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif; }
  </style>

  <rect width="1000" height="230" rx="14" fill="url(#bgGrad)"/>
  <rect width="1000" height="230" rx="14" fill="url(#grid)"/>
  <rect width="1000" height="230" rx="14" stroke="#38BDF8" stroke-width="1" fill="none">
    <animate attributeName="stroke-opacity" values="0.15;0.35;0.15" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- Section Header -->
  <g>
    <text x="24" y="30" class="mono" font-size="10.5" font-weight="600" fill="#38BDF8" letter-spacing="1.5">// BEYOND THE TERMINAL</text>
    <text x="24" y="52" class="sans" font-size="19" font-weight="800" fill="#F8FAFC" letter-spacing="0.5">HOBBIES &amp; INTERESTS</text>
    <path d="M 24 60 L 220 60" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
    <path d="M 228 60 L 976 60" stroke="rgba(56, 189, 248, 0.15)" stroke-width="1" stroke-dasharray="3 3">
      <animate attributeName="stroke-dashoffset" from="0" to="24" dur="4s" repeatCount="indefinite"/>
    </path>
    <line x1="228" y1="60" x2="360" y2="60" stroke="url(#beamGrad)" stroke-width="2">
      <animate attributeName="x1" values="228;840;228" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="360;972;360" dur="9s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- ROW 1 (5 Cards: x=24, 218, 412, 606, 800 | w=176, h=68) -->
  <!-- 1. Tech & AI -->
  <g opacity="0" transform="translate(24, 82)">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.1s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="24 82" to="24 74" dur="0.4s" begin="0.1s" fill="freeze"/>
    
    <rect width="178" height="68" rx="8" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1">
      <animate attributeName="stroke-opacity" values="0.2;0.6;0.2" dur="3.5s" repeatCount="indefinite"/>
    </rect>
    <!-- Microchip Icon with slow pulse -->
    <g>
      <rect x="14" y="16" width="20" height="20" rx="3" fill="none" stroke="#38BDF8" stroke-width="1.4"/>
      <rect x="18" y="20" width="12" height="12" rx="1" fill="#38BDF8">
        <animate attributeName="fill-opacity" values="0.2;0.65;0.2" dur="2.8s" repeatCount="indefinite"/>
      </rect>
      <path d="M 10 22 H 14 M 10 30 H 14 M 34 22 H 38 M 34 30 H 38 M 20 12 V 16 M 28 12 V 16 M 20 36 V 40 M 28 36 V 40" stroke="#38BDF8" stroke-width="1.2">
        <animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="2.8s" repeatCount="indefinite"/>
      </path>
    </g>
    <text x="44" y="27" class="sans" font-size="11.5" font-weight="700" fill="#F8FAFC">Tech &amp; AI</text>
    <text x="44" y="41" class="mono" font-size="8.5" fill="#94A3B8">Next-Gen Systems</text>
    <text x="14" y="58" class="sans" font-size="9" fill="#38BDF8">Emerging Architectures</text>
  </g>

  <!-- 2. Learning -->
  <g opacity="0" transform="translate(218, 82)">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.2s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="218 82" to="218 74" dur="0.4s" begin="0.2s" fill="freeze"/>
    
    <rect width="178" height="68" rx="8" fill="url(#cardGrad)" stroke="#818CF8" stroke-width="1">
      <animate attributeName="stroke-opacity" values="0.25;0.65;0.25" dur="3.8s" repeatCount="indefinite"/>
    </rect>
    <!-- Book/Growth Icon with small vertical float -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -2.5; 0 0" dur="3s" repeatCount="indefinite"/>
      <path d="M 14 18 C 18 16 24 16 26 19 C 28 16 34 16 38 18 V 34 C 34 32 28 32 26 35 C 24 32 18 32 14 34 Z" fill="none" stroke="#818CF8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 26 19 V 35" stroke="#818CF8" stroke-width="1.2"/>
    </g>
    <text x="46" y="27" class="sans" font-size="11.5" font-weight="700" fill="#F8FAFC">Learning</text>
    <text x="46" y="41" class="mono" font-size="8.5" fill="#94A3B8">Continuous Growth</text>
    <text x="14" y="58" class="sans" font-size="9" fill="#818CF8">Deep Dives &amp; Research</text>
  </g>

  <!-- 3. Problem Solving -->
  <g opacity="0" transform="translate(412, 82)">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.3s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="412 82" to="412 74" dur="0.4s" begin="0.3s" fill="freeze"/>
    
    <rect width="178" height="68" rx="8" fill="url(#cardGrad)" stroke="#A78BFA" stroke-width="1">
      <animate attributeName="stroke-opacity" values="0.25;0.65;0.25" dur="4.1s" repeatCount="indefinite"/>
    </rect>
    <!-- Puzzle/Logic Icon with subtle rotation -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-4 26 28; 4 26 28; -4 26 28" dur="4s" repeatCount="indefinite"/>
      <path d="M 16 18 H 22 C 22 20 24 21 26 21 C 28 21 30 20 30 18 H 36 V 24 C 34 24 33 26 33 28 C 33 30 34 32 36 32 V 38 H 30 C 30 36 28 35 26 35 C 24 35 22 36 22 38 H 16 V 32 C 18 32 19 30 19 28 C 19 26 18 24 16 24 Z" fill="none" stroke="#A78BFA" stroke-width="1.3" stroke-linejoin="round"/>
    </g>
    <text x="44" y="27" class="sans" font-size="11.5" font-weight="700" fill="#F8FAFC">Problem Solving</text>
    <text x="44" y="41" class="mono" font-size="8.5" fill="#94A3B8">Algorithms &amp; Logic</text>
    <text x="14" y="58" class="sans" font-size="9" fill="#A78BFA">Structured Thinking</text>
  </g>

  <!-- 4. Product Building -->
  <g opacity="0" transform="translate(606, 82)">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.4s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="606 82" to="606 74" dur="0.4s" begin="0.4s" fill="freeze"/>
    
    <rect width="178" height="68" rx="8" fill="url(#cardGrad)" stroke="#10B981" stroke-width="1">
      <animate attributeName="stroke-opacity" values="0.25;0.65;0.25" dur="3.6s" repeatCount="indefinite"/>
    </rect>
    <!-- Blueprint/Building Icon with pulse -->
    <g>
      <animateTransform attributeName="transform" type="scale" values="1 1; 1.06 1.06; 1 1" dur="3.2s" repeatCount="indefinite" transform-origin="26 26"/>
      <path d="M 16 36 V 18 L 26 14 L 36 18 V 36 H 16 Z" fill="none" stroke="#10B981" stroke-width="1.4" stroke-linejoin="round"/>
      <path d="M 26 14 V 36 M 16 24 H 36 M 16 30 H 36" stroke="#10B981" stroke-width="1" stroke-opacity="0.6"/>
    </g>
    <text x="44" y="27" class="sans" font-size="11.5" font-weight="700" fill="#F8FAFC">Product Building</text>
    <text x="44" y="41" class="mono" font-size="8.5" fill="#94A3B8">Zero to Launch</text>
    <text x="14" y="58" class="sans" font-size="9" fill="#10B981">MVP &amp; Real Users</text>
  </g>

  <!-- 5. Cricket -->
  <g opacity="0" transform="translate(800, 82)">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.5s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="800 82" to="800 74" dur="0.4s" begin="0.5s" fill="freeze"/>
    
    <rect width="176" height="68" rx="8" fill="url(#cardGrad)" stroke="#F59E0B" stroke-width="1">
      <animate attributeName="stroke-opacity" values="0.25;0.65;0.25" dur="4.4s" repeatCount="indefinite"/>
    </rect>
    <!-- Cricket Bat & Ball with subtle movement -->
    <g>
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0 23 28; -4 23 28; 0 23 28" dur="2.6s" repeatCount="indefinite"/>
        <path d="M 16 36 L 27 18 L 30 20 L 19 38 Z" fill="none" stroke="#F59E0B" stroke-width="1.4" stroke-linejoin="round"/>
        <path d="M 27 18 L 32 12" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
      </g>
      <circle cx="33" cy="30" r="4" fill="none" stroke="#F59E0B" stroke-width="1.4">
        <animateTransform attributeName="transform" type="translate" values="0 0; 1 -2; 0 0" dur="2.6s" repeatCount="indefinite"/>
      </circle>
    </g>
    <text x="42" y="27" class="sans" font-size="11.5" font-weight="700" fill="#F8FAFC">Cricket</text>
    <text x="42" y="41" class="mono" font-size="8.5" fill="#94A3B8">Sports &amp; Strategy</text>
    <text x="14" y="58" class="sans" font-size="9" fill="#F59E0B">Team Dynamics</text>
  </g>

  <!-- ROW 2 (4 Cards: x=24, 269, 514, 759 | w=227, h=68) -->
  <!-- 6. Movies -->
  <g opacity="0" transform="translate(24, 158)">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.6s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="24 158" to="24 150" dur="0.4s" begin="0.6s" fill="freeze"/>
    
    <rect width="227" height="66" rx="8" fill="url(#cardGrad)" stroke="#EC4899" stroke-width="1">
      <animate attributeName="stroke-opacity" values="0.25;0.65;0.25" dur="3.9s" repeatCount="indefinite"/>
    </rect>
    <!-- Cinema Clapper icon with pulse -->
    <g>
      <rect x="14" y="16" width="24" height="18" rx="2" fill="none" stroke="#EC4899" stroke-width="1.4"/>
      <path d="M 14 22 H 38 M 20 16 L 22 22 M 28 16 L 30 22" stroke="#EC4899" stroke-width="1.2"/>
      <path d="M 24 26 L 30 29 L 24 32 Z" fill="#EC4899">
        <animate attributeName="fill-opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
      </path>
    </g>
    <text x="48" y="27" class="sans" font-size="11.5" font-weight="700" fill="#F8FAFC">Movies &amp; Cinema</text>
    <text x="48" y="41" class="mono" font-size="8.5" fill="#94A3B8">Visual Storytelling</text>
    <text x="14" y="57" class="sans" font-size="9" fill="#EC4899">Narrative Craft &amp; Direction</text>
  </g>

  <!-- 7. Travel -->
  <g opacity="0" transform="translate(269, 158)">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.7s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="269 158" to="269 150" dur="0.4s" begin="0.7s" fill="freeze"/>
    
    <rect width="227" height="66" rx="8" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1">
      <animate attributeName="stroke-opacity" values="0.2;0.6;0.2" dur="4.2s" repeatCount="indefinite"/>
    </rect>
    <!-- Compass Icon with slow orbit / compass sway -->
    <g>
      <circle cx="26" cy="26" r="11" fill="none" stroke="#38BDF8" stroke-width="1.4"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-18 26 26; 22 26 26; -18 26 26" dur="5.5s" repeatCount="indefinite"/>
        <polygon points="26,18 29,26 26,24 23,26" fill="#38BDF8"/>
        <polygon points="26,34 29,26 26,24 23,26" fill="#94A3B8"/>
      </g>
    </g>
    <text x="48" y="27" class="sans" font-size="11.5" font-weight="700" fill="#F8FAFC">Travel &amp; Roadtrips</text>
    <text x="48" y="41" class="mono" font-size="8.5" fill="#94A3B8">New Perspectives</text>
    <text x="14" y="57" class="sans" font-size="9" fill="#38BDF8">Exploring Coastal Routes</text>
  </g>

  <!-- 8. Photography -->
  <g opacity="0" transform="translate(514, 158)">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.8s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="514 158" to="514 150" dur="0.4s" begin="0.8s" fill="freeze"/>
    
    <rect width="227" height="66" rx="8" fill="url(#cardGrad)" stroke="#818CF8" stroke-width="1">
      <animate attributeName="stroke-opacity" values="0.25;0.65;0.25" dur="3.7s" repeatCount="indefinite"/>
    </rect>
    <!-- Camera/Lens Icon with lens-like glow -->
    <g>
      <path d="M 14 20 C 14 18 16 17 18 17 H 21 L 23 15 H 29 L 31 17 H 34 C 36 17 38 18 38 20 V 32 C 38 34 36 35 34 35 H 18 C 16 35 14 34 14 32 Z" fill="none" stroke="#818CF8" stroke-width="1.4"/>
      <circle cx="26" cy="26" r="5" fill="none" stroke="#818CF8" stroke-width="1.3">
        <animate attributeName="r" values="4.5;5.6;4.5" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="26" cy="26" r="2.2" fill="#818CF8">
        <animate attributeName="fill-opacity" values="0.3;0.9;0.3" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="33" cy="20" r="1" fill="#818CF8"/>
    </g>
    <text x="48" y="27" class="sans" font-size="11.5" font-weight="700" fill="#F8FAFC">Photography</text>
    <text x="48" y="41" class="mono" font-size="8.5" fill="#94A3B8">Moments &amp; Lighting</text>
    <text x="14" y="57" class="sans" font-size="9" fill="#818CF8">Street, Ocean &amp; Scenery</text>
  </g>

  <!-- 9. Exploring New Ideas -->
  <g opacity="0" transform="translate(759, 158)">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.9s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="759 158" to="759 150" dur="0.4s" begin="0.9s" fill="freeze"/>
    
    <rect width="217" height="66" rx="8" fill="url(#cardGrad)" stroke="#34D399" stroke-width="1">
      <animate attributeName="stroke-opacity" values="0.25;0.65;0.25" dur="4.3s" repeatCount="indefinite"/>
    </rect>
    <!-- Lightbulb/Telescope Icon with small rotating ring -->
    <g>
      <!-- Small rotating halo ring around bulb -->
      <circle cx="26" cy="22" r="9" fill="none" stroke="#34D399" stroke-width="1" stroke-dasharray="2 3">
        <animateTransform attributeName="transform" type="rotate" from="0 26 22" to="360 26 22" dur="7s" repeatCount="indefinite"/>
      </circle>
      <path d="M 26 15 C 22 15 19 18 19 22 C 19 25 21 27 22 29 V 31 H 30 V 29 C 31 27 33 25 33 22 C 33 18 30 15 26 15 Z" fill="none" stroke="#34D399" stroke-width="1.4"/>
      <path d="M 23 33 H 29 M 24 35 H 28" stroke="#34D399" stroke-width="1.3" stroke-linecap="round"/>
    </g>
    <text x="46" y="27" class="sans" font-size="11.5" font-weight="700" fill="#F8FAFC">Exploring Ideas</text>
    <text x="46" y="41" class="mono" font-size="8.5" fill="#94A3B8">Brainstorms &amp; Prototypes</text>
    <text x="14" y="57" class="sans" font-size="9" fill="#34D399">Experimenting Fast</text>
  </g>
</svg>