<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 155" width="1000" height="155" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050A14"/>
      <stop offset="50%" stop-color="#07111F"/>
      <stop offset="100%" stop-color="#0B162C"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0D192E" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#081020" stop-opacity="0.95"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(56, 189, 248, 0.035)" stroke-width="1"/>
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'SF Mono', Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif; }
  </style>

  <rect width="1000" height="155" rx="14" fill="url(#bgGrad)"/>
  <rect width="1000" height="155" rx="14" fill="url(#grid)"/>
  <rect width="1000" height="155" rx="14" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1" fill="none"/>

  <!-- Section Header -->
  <text x="24" y="26" class="mono" font-size="10" font-weight="600" fill="#38BDF8" letter-spacing="1.5">// REAL-TIME METRICS • Madhu-0205</text>
  <text x="24" y="46" class="sans" font-size="17" font-weight="800" fill="#F8FAFC" letter-spacing="0.5">GITHUB STATS</text>
  <path d="M 24 53 L 150 53" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
  <path d="M 158 53 L 976 53" stroke="rgba(56, 189, 248, 0.15)" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Stat 1: Public Repos -->
  <g transform="translate(24, 64)">
    <rect width="227" height="76" rx="8" fill="url(#cardGrad)" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1"/>
    <rect x="0" y="0" width="227" height="2" fill="#38BDF8" rx="1"/>
    <circle cx="24" cy="24" r="11" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1"/>
    <path d="M 18 20 H 22 L 24 22 H 30 V 28 H 18 Z" fill="none" stroke="#38BDF8" stroke-width="1.3"/>
    <text x="42" y="20" class="mono" font-size="9" fill="#94A3B8" letter-spacing="0.5">PUBLIC REPOS</text>
    <text x="42" y="40" class="mono" font-size="21" font-weight="800" fill="#F8FAFC">12</text>
    <text x="16" y="64" class="mono" font-size="8.5" fill="#38BDF8">● 12 Production &amp; Labs</text>
  </g>

  <!-- Stat 2: Total Contributions -->
  <g transform="translate(269, 64)">
    <rect width="227" height="76" rx="8" fill="url(#cardGrad)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1"/>
    <rect x="0" y="0" width="227" height="2" fill="#10B981" rx="1"/>
    <circle cx="24" cy="24" r="11" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1"/>
    <path d="M 18 27 L 22 21 L 26 25 L 30 19" fill="none" stroke="#10B981" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="42" y="20" class="mono" font-size="9" fill="#94A3B8" letter-spacing="0.5">TOTAL CONTRIBUTIONS</text>
    <text x="42" y="40" class="mono" font-size="21" font-weight="800" fill="#F8FAFC">295</text>
    <text x="16" y="64" class="mono" font-size="8.5" fill="#10B981">● In The Last Year</text>
  </g>

  <!-- Stat 3: Current Streak -->
  <g transform="translate(514, 64)">
    <rect width="227" height="76" rx="8" fill="url(#cardGrad)" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1"/>
    <rect x="0" y="0" width="227" height="2" fill="#F59E0B" rx="1"/>
    <circle cx="24" cy="24" r="11" fill="rgba(245, 158, 11, 0.12)" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1"/>
    <path d="M 24 16 C 24 16 21 21 21 24 C 21 26 22.5 28 24 28 C 25.5 28 27 26 27 24 C 27 21 24 16 24 16 Z" fill="#F59E0B"/>
    <text x="42" y="20" class="mono" font-size="9" fill="#94A3B8" letter-spacing="0.5">CURRENT STREAK</text>
    <text x="42" y="40" class="mono" font-size="21" font-weight="800" fill="#F8FAFC">12 Days</text>
    <text x="16" y="64" class="mono" font-size="8.5" fill="#F59E0B">● Active Daily Momentum</text>
  </g>

  <!-- Stat 4: Longest Streak -->
  <g transform="translate(759, 64)">
    <rect width="217" height="76" rx="8" fill="url(#cardGrad)" stroke="rgba(139, 92, 246, 0.3)" stroke-width="1"/>
    <rect x="0" y="0" width="217" height="2" fill="#8B5CF6" rx="1"/>
    <circle cx="24" cy="24" r="11" fill="rgba(139, 92, 246, 0.12)" stroke="rgba(139, 92, 246, 0.4)" stroke-width="1"/>
    <path d="M 19 18 H 29 V 23 C 29 26 26.5 28 24 28 C 21.5 28 19 26 19 23 Z M 21 28 L 20 31 H 28 L 27 28" fill="none" stroke="#8B5CF6" stroke-width="1.3"/>
    <text x="42" y="20" class="mono" font-size="9" fill="#94A3B8" letter-spacing="0.5">LONGEST STREAK</text>
    <text x="42" y="40" class="mono" font-size="21" font-weight="800" fill="#F8FAFC">12 Days</text>
    <text x="16" y="64" class="mono" font-size="8.5" fill="#8B5CF6">● Consistent Active Days</text>
  </g>
</svg>