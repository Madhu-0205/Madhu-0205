<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 155" width="1000" height="155" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050A14"/>
      <stop offset="50%" stop-color="#07111F"/>
      <stop offset="100%" stop-color="#0B162C"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0D192E" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#081020" stop-opacity="0.96"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(56, 189, 248, 0.035)" stroke-width="1"/>
    </pattern>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'SF Mono', Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif; }
  </style>

  <rect width="1000" height="155" rx="14" fill="url(#bgGrad)"/>
  <rect width="1000" height="155" rx="14" fill="url(#grid)"/>
  <rect width="1000" height="155" rx="14" stroke="#38BDF8" stroke-width="1" fill="none">
    <animate attributeName="stroke-opacity" values="0.15;0.35;0.15" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- Section Header -->
  <g>
    <text x="24" y="26" class="mono" font-size="10" font-weight="600" fill="#38BDF8" letter-spacing="1.5">// REAL-TIME METRICS • Madhu-0205</text>
    <text x="24" y="46" class="sans" font-size="17" font-weight="800" fill="#F8FAFC" letter-spacing="0.5">GITHUB STATS</text>
    <path d="M 24 53 L 150 53" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
    <path d="M 158 53 L 976 53" stroke="rgba(56, 189, 248, 0.15)" stroke-width="1" stroke-dasharray="3 3">
      <animate attributeName="stroke-dashoffset" from="0" to="24" dur="4s" repeatCount="indefinite"/>
    </path>
    <line x1="158" y1="53" x2="290" y2="53" stroke="url(#beamGrad)" stroke-width="2">
      <animate attributeName="x1" values="158;840;158" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="290;972;290" dur="8s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Stat 1: Public Repos -->
  <g opacity="0" transform="translate(24, 72)">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.1s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="24 72" to="24 64" dur="0.4s" begin="0.1s" fill="freeze"/>

    <rect width="227" height="76" rx="8" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1">
      <animate attributeName="stroke-opacity" values="0.25;0.65;0.25" dur="3.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="0" y="0" width="227" height="2" fill="#38BDF8" rx="1"/>
    
    <circle cx="24" cy="24" r="11" fill="rgba(56, 189, 248, 0.12)" stroke="#38BDF8" stroke-width="1">
      <animate attributeName="stroke-opacity" values="0.4;0.9;0.4" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <path d="M 18 20 H 22 L 24 22 H 30 V 28 H 18 Z" fill="none" stroke="#38BDF8" stroke-width="1.3"/>
    
    <text x="42" y="20" class="mono" font-size="9" fill="#94A3B8" letter-spacing="0.5">PUBLIC REPOS</text>
    
    <!-- Real number reveal -->
    <text x="42" y="40" class="mono" font-size="21" font-weight="800" fill="#F8FAFC" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.25s" fill="freeze"/>
      12
    </text>
    
    <!-- Mini progress bar self-grow -->
    <rect x="16" y="50" width="195" height="3" rx="1.5" fill="rgba(56, 189, 248, 0.1)"/>
    <rect x="16" y="50" width="0" height="3" rx="1.5" fill="#38BDF8">
      <animate attributeName="width" from="0" to="140" dur="0.9s" begin="0.3s" fill="freeze"/>
    </rect>
    
    <circle cx="20" cy="65" r="2.5" fill="#38BDF8">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="28" y="68" class="mono" font-size="8.5" fill="#38BDF8">12 Production &amp; Labs</text>
  </g>

  <!-- Stat 2: Total Contributions -->
  <g opacity="0" transform="translate(269, 72)">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.25s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="269 72" to="269 64" dur="0.4s" begin="0.25s" fill="freeze"/>

    <rect width="227" height="76" rx="8" fill="url(#cardGrad)" stroke="#10B981" stroke-width="1">
      <animate attributeName="stroke-opacity" values="0.3;0.7;0.3" dur="4.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="0" y="0" width="227" height="2" fill="#10B981" rx="1"/>
    
    <circle cx="24" cy="24" r="11" fill="rgba(16, 185, 129, 0.12)" stroke="#10B981" stroke-width="1">
      <animate attributeName="stroke-opacity" values="0.4;0.9;0.4" dur="3s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Self-drawing sparkline icon -->
    <path d="M 18 27 L 22 21 L 26 25 L 30 19" fill="none" stroke="#10B981" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="24" stroke-dashoffset="24">
      <animate attributeName="stroke-dashoffset" from="24" to="0" dur="0.8s" begin="0.35s" fill="freeze"/>
    </path>
    
    <text x="42" y="20" class="mono" font-size="9" fill="#94A3B8" letter-spacing="0.5">TOTAL CONTRIBUTIONS</text>
    
    <!-- Real number reveal -->
    <text x="42" y="40" class="mono" font-size="21" font-weight="800" fill="#F8FAFC" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.4s" fill="freeze"/>
      295
    </text>
    
    <!-- Mini progress bar self-grow -->
    <rect x="16" y="50" width="195" height="3" rx="1.5" fill="rgba(16, 185, 129, 0.1)"/>
    <rect x="16" y="50" width="0" height="3" rx="1.5" fill="#10B981">
      <animate attributeName="width" from="0" to="168" dur="0.9s" begin="0.45s" fill="freeze"/>
    </rect>
    
    <circle cx="20" cy="65" r="2.5" fill="#10B981">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <text x="28" y="68" class="mono" font-size="8.5" fill="#10B981">In The Last Year</text>
  </g>

  <!-- Stat 3: Current Streak -->
  <g opacity="0" transform="translate(514, 72)">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.4s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="514 72" to="514 64" dur="0.4s" begin="0.4s" fill="freeze"/>

    <rect width="227" height="76" rx="8" fill="url(#cardGrad)" stroke="#F59E0B" stroke-width="1">
      <animate attributeName="stroke-opacity" values="0.3;0.7;0.3" dur="3.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="0" y="0" width="227" height="2" fill="#F59E0B" rx="1"/>
    
    <circle cx="24" cy="24" r="11" fill="rgba(245, 158, 11, 0.12)" stroke="#F59E0B" stroke-width="1">
      <animate attributeName="stroke-opacity" values="0.4;0.9;0.4" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Flame with pulse -->
    <path d="M 24 16 C 24 16 21 21 21 24 C 21 26 22.5 28 24 28 C 25.5 28 27 26 27 24 C 27 21 24 16 24 16 Z" fill="#F59E0B">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="scale" values="1 1; 1.08 1.08; 1 1" dur="2s" repeatCount="indefinite" transform-origin="24 24"/>
    </path>
    
    <text x="42" y="20" class="mono" font-size="9" fill="#94A3B8" letter-spacing="0.5">CURRENT STREAK</text>
    
    <!-- Real number reveal -->
    <text x="42" y="40" class="mono" font-size="21" font-weight="800" fill="#F8FAFC" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.55s" fill="freeze"/>
      12 Days
    </text>
    
    <!-- Mini progress bar self-grow -->
    <rect x="16" y="50" width="195" height="3" rx="1.5" fill="rgba(245, 158, 11, 0.1)"/>
    <rect x="16" y="50" width="0" height="3" rx="1.5" fill="#F59E0B">
      <animate attributeName="width" from="0" to="150" dur="0.9s" begin="0.6s" fill="freeze"/>
    </rect>
    
    <circle cx="20" cy="65" r="2.5" fill="#F59E0B">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="28" y="68" class="mono" font-size="8.5" fill="#F59E0B">Active Daily Momentum</text>
  </g>

  <!-- Stat 4: Longest Streak -->
  <g opacity="0" transform="translate(759, 72)">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.55s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="759 72" to="759 64" dur="0.4s" begin="0.55s" fill="freeze"/>

    <rect width="217" height="76" rx="8" fill="url(#cardGrad)" stroke="#8B5CF6" stroke-width="1">
      <animate attributeName="stroke-opacity" values="0.3;0.7;0.3" dur="4.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="0" y="0" width="217" height="2" fill="#8B5CF6" rx="1"/>
    
    <circle cx="24" cy="24" r="11" fill="rgba(139, 92, 246, 0.12)" stroke="#8B5CF6" stroke-width="1">
      <animate attributeName="stroke-opacity" values="0.4;0.9;0.4" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <path d="M 19 18 H 29 V 23 C 29 26 26.5 28 24 28 C 21.5 28 19 26 19 23 Z M 21 28 L 20 31 H 28 L 27 28" fill="none" stroke="#8B5CF6" stroke-width="1.3"/>
    
    <text x="42" y="20" class="mono" font-size="9" fill="#94A3B8" letter-spacing="0.5">LONGEST STREAK</text>
    
    <!-- Real number reveal -->
    <text x="42" y="40" class="mono" font-size="21" font-weight="800" fill="#F8FAFC" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.7s" fill="freeze"/>
      12 Days
    </text>
    
    <!-- Mini progress bar self-grow -->
    <rect x="16" y="50" width="185" height="3" rx="1.5" fill="rgba(139, 92, 246, 0.1)"/>
    <rect x="16" y="50" width="0" height="3" rx="1.5" fill="#8B5CF6">
      <animate attributeName="width" from="0" to="150" dur="0.9s" begin="0.75s" fill="freeze"/>
    </rect>
    
    <circle cx="20" cy="65" r="2.5" fill="#8B5CF6">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <text x="28" y="68" class="mono" font-size="8.5" fill="#8B5CF6">Consistent Active Days</text>
  </g>
</svg>