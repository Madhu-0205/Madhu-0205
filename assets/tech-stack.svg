      </rect>
      <circle cx="18" cy="19" r="5" fill="#3178C6"/>
      <text x="32" y="19" class="sans" font-size="11.5" font-weight="700" fill="#F8FAFC">TypeScript</text>
      <text x="32" y="31" class="mono" font-size="8" fill="#38BDF8">Primary 74.4%</text>
    </g>

    <!-- JavaScript -->
