      <circle cx="18" cy="19" r="5" fill="#F7DF1E"/>
      <text x="32" y="19" class="sans" font-size="11.5" font-weight="700" fill="#F8FAFC">JavaScript</text>
      <text x="32" y="31" class="mono" font-size="8" fill="#94A3B8">Full-Stack 20.0%</text>
    </g>

    <!-- Java -->
    <g transform="translate(156, 88)">
      <rect width="132" height="38" class="pill"/>
      <circle cx="18" cy="19" r="5" fill="#ED8B00"/>
      <text x="32" y="19" class="sans" font-size="11.5" font-weight="700" fill="#F8FAFC">Java</text>
      <text x="32" y="31" class="mono" font-size="8" fill="#94A3B8">OOP • Academic</text>
