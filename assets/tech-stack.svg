    <rect width="304" height="142" rx="10" fill="url(#cardGrad)" stroke="#6366F1" stroke-width="1">
      <animate attributeName="stroke-opacity" values="0.3;0.7;0.3" dur="4.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="0" y="0" width="304" height="2" fill="#6366F1" rx="1"/>
    
    <text x="16" y="26" class="mono" font-size="11" font-weight="700" fill="#818CF8" letter-spacing="1">[02] FRONTEND</text>
    <circle cx="286" cy="22" r="3" fill="#818CF8">
