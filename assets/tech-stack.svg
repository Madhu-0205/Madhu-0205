<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" width="1000" height="390" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050A14"/>
      <stop offset="50%" stop-color="#07111F"/>
      <stop offset="100%" stop-color="#0B162C"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0D192E" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#081020" stop-opacity="0.96"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(56, 189, 248, 0.035)" stroke-width="1"/>
    </pattern>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'SF Mono', Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif; }
    .pill { rx: 6px; fill: #071322; stroke: rgba(56, 189, 248, 0.3); stroke-width: 1; }
    .pill-active { rx: 6px; fill: #08192E; stroke: rgba(56, 189, 248, 0.6); stroke-width: 1; }
  </style>

  <rect width="1000" height="390" rx="14" fill="url(#bgGrad)"/>
  <rect width="1000" height="390" rx="14" fill="url(#grid)"/>
  <rect width="1000" height="390" rx="14" stroke="#38BDF8" stroke-width="1" fill="none">
    <animate attributeName="stroke-opacity" values="0.15;0.35;0.15" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- Section Header -->
  <g>
    <text x="24" y="30" class="mono" font-size="10.5" font-weight="600" fill="#38BDF8" letter-spacing="1.5">// ARSENAL &amp; ENVIRONMENT</text>
    <text x="24" y="52" class="sans" font-size="19" font-weight="800" fill="#F8FAFC" letter-spacing="0.5">TECH STACK</text>
    <path d="M 24 60 L 140 60" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
    <path d="M 148 60 L 976 60" stroke="rgba(56, 189, 248, 0.15)" stroke-width="1" stroke-dasharray="3 3">
