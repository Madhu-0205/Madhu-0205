<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050A14"/>
      <stop offset="50%" stop-color="#07111F"/>
      <stop offset="100%" stop-color="#0B162C"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0D192E" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#081020" stop-opacity="0.96"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(56, 189, 248, 0.035)" stroke-width="1"/>
    </pattern>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'SF Mono', Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif; }
  </style>

  <rect width="1000" height="300" rx="14" fill="url(#bgGrad)"/>
  <rect width="1000" height="300" rx="14" fill="url(#grid)"/>
  <rect width="1000" height="300" rx="14" stroke="#38BDF8" stroke-width="1" fill="none">
    <animate attributeName="stroke-opacity" values="0.15;0.4;0.15" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- Section Header -->
  <g>
    <text x="24" y="32" class="mono" font-size="10.5" font-weight="600" fill="#38BDF8" letter-spacing="1.5">// CAPABILITIES &amp; SPECIALIZATIONS</text>
    <text x="24" y="55" class="sans" font-size="19" font-weight="800" fill="#F8FAFC" letter-spacing="0.5">WHAT I BUILD</text>
    <path d="M 24 64 L 140 64" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
    <path d="M 148 64 L 976 64" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1" stroke-dasharray="4 4">
      <animate attributeName="stroke-dashoffset" from="0" to="24" dur="3s" repeatCount="indefinite"/>
    </path>
    <!-- Scanning Highlight Beam along header line -->
    <line x1="148" y1="64" x2="280" y2="64" stroke="url(#beamGrad)" stroke-width="2">
      <animate attributeName="x1" values="148;840;148" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="280;972;280" dur="8s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- ROW 1 (3 Cards) -->
  <!-- Card 1: Full-Stack Web Applications -->
  <g opacity="0" transform="translate(24, 88)">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.15s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="24 88" to="24 76" dur="0.5s" begin="0.15s" fill="freeze"/>
    
    <rect width="300" height="95" rx="10" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1">
      <animate attributeName="stroke-opacity" values="0.25;0.65;0.25" dur="4s" repeatCount="indefinite"/>
    </rect>
    <rect x="0" y="0" width="300" height="2" fill="#38BDF8" rx="1"/>
    
    <!-- Blinking signal LED -->
    <circle cx="286" cy="14" r="2.5" fill="#38BDF8">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Icon Circle with subtle breathing -->
    <circle cx="26" cy="28" r="14" fill="rgba(56, 189, 248, 0.12)" stroke="#38BDF8" stroke-width="1">
      <animate attributeName="stroke-opacity" values="0.35;0.8;0.35" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="r" values="14;14.8;14" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <path d="M 20 28 L 26 23 L 32 28 L 26 33 Z M 20 31 L 26 36 L 32 31" fill="none" stroke="#38BDF8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    
    <text x="48" y="27" class="sans" font-size="12.5" font-weight="700" fill="#F8FAFC">Full-Stack Web Apps</text>
    <text x="48" y="41" class="mono" font-size="9" fill="#38BDF8">// NEXT.JS • REACT • TS</text>
    <text x="16" y="62" class="sans" font-size="10.5" fill="#CBD5E1">Scalable web platforms engineered with</text>
    <text x="16" y="77" class="sans" font-size="10.5" fill="#CBD5E1">modern microservices and type-safe APIs.</text>
  </g>

  <!-- Card 2: AI-Powered Tools & Automation -->
  <g opacity="0" transform="translate(348, 88)">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.35s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="348 88" to="348 76" dur="0.5s" begin="0.35s" fill="freeze"/>
    
    <rect width="304" height="95" rx="10" fill="url(#cardGrad)" stroke="#6366F1" stroke-width="1">
      <animate attributeName="stroke-opacity" values="0.3;0.7;0.3" dur="4.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="0" y="0" width="304" height="2" fill="#6366F1" rx="1"/>
    
    <!-- Blinking signal LED -->
    <circle cx="290" cy="14" r="2.5" fill="#818CF8">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    
    <circle cx="26" cy="28" r="14" fill="rgba(99, 102, 241, 0.12)" stroke="#6366F1" stroke-width="1">
      <animate attributeName="stroke-opacity" values="0.4;0.85;0.4" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="r" values="14;14.8;14" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <path d="M 26 21 L 27.5 25.5 L 32 27 L 27.5 28.5 L 26 33 L 24.5 28.5 L 20 27 L 24.5 25.5 Z" fill="#818CF8" stroke="none">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2.5s" repeatCount="indefinite"/>
    </path>
    
    <text x="48" y="27" class="sans" font-size="12.5" font-weight="700" fill="#F8FAFC">AI Tools &amp; Automation</text>
    <text x="48" y="41" class="mono" font-size="9" fill="#818CF8">// LLMS • VISION • FASTAPI</text>
    <text x="16" y="62" class="sans" font-size="10.5" fill="#CBD5E1">Intelligent workflow agents, computer vision</text>
    <text x="16" y="77" class="sans" font-size="10.5" fill="#CBD5E1">parsers, and multi-model AI pipelines.</text>
  </g>

  <!-- Card 3: Data Analytics & Visualization -->
  <g opacity="0" transform="translate(676, 88)">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.55s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="676 88" to="676 76" dur="0.5s" begin="0.55s" fill="freeze"/>
    
    <rect width="300" height="95" rx="10" fill="url(#cardGrad)" stroke="#A78BFA" stroke-width="1">
      <animate attributeName="stroke-opacity" values="0.3;0.7;0.3" dur="4.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="0" y="0" width="300" height="2" fill="#A78BFA" rx="1"/>
    
    <!-- Blinking signal LED -->
    <circle cx="286" cy="14" r="2.5" fill="#A78BFA">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.9s" repeatCount="indefinite"/>
    </circle>
    
    <circle cx="26" cy="28" r="14" fill="rgba(167, 139, 250, 0.12)" stroke="#A78BFA" stroke-width="1">
      <animate attributeName="stroke-opacity" values="0.4;0.85;0.4" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="r" values="14;14.8;14" dur="3.8s" repeatCount="indefinite"/>
    </circle>
    <path d="M 21 33 V 29 M 26 33 V 24 M 31 33 V 21" stroke="#A78BFA" stroke-width="1.8" stroke-linecap="round">
      <animate attributeName="stroke-opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
    </path>
    
    <text x="48" y="27" class="sans" font-size="12.5" font-weight="700" fill="#F8FAFC">Data Analytics &amp; Viz</text>
    <text x="48" y="41" class="mono" font-size="9" fill="#A78BFA">// PANDAS • PYTORCH • POSTGIS</text>
    <text x="16" y="62" class="sans" font-size="10.5" fill="#CBD5E1">Actionable telemetry dashboards, spatial</text>
    <text x="16" y="77" class="sans" font-size="10.5" fill="#CBD5E1">queries, and data distribution models.</text>
  </g>

  <!-- ROW 2 (2 Wider Cards) -->
  <!-- Card 4: Real-World Problem-Solving Products -->
  <g opacity="0" transform="translate(24, 197)">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.75s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="24 197" to="24 185" dur="0.5s" begin="0.75s" fill="freeze"/>
    
    <rect width="464" height="95" rx="10" fill="url(#cardGrad)" stroke="#10B981" stroke-width="1">
      <animate attributeName="stroke-opacity" values="0.3;0.7;0.3" dur="4.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="0" y="0" width="464" height="2" fill="#10B981" rx="1"/>
    
    <!-- Blinking signal LED -->
    <circle cx="450" cy="14" r="2.5" fill="#10B981">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    
    <circle cx="28" cy="28" r="14" fill="rgba(16, 185, 129, 0.12)" stroke="#10B981" stroke-width="1">
      <animate attributeName="stroke-opacity" values="0.4;0.85;0.4" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="r" values="14;14.8;14" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <path d="M 22 28 L 26 32 L 34 24" fill="none" stroke="#10B981" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    
    <text x="50" y="27" class="sans" font-size="12.5" font-weight="700" fill="#F8FAFC">Real-World Problem-Solving Products</text>
    <text x="50" y="41" class="mono" font-size="9" fill="#10B981">// HYPERLOCAL GIGS • RAIL TRAFFIC • SIH INNOVATION</text>
    <text x="18" y="62" class="sans" font-size="10.5" fill="#CBD5E1">Production solutions tackling student-employer friction (JobNest),</text>
    <text x="18" y="77" class="sans" font-size="10.5" fill="#CBD5E1">train dispatch conflict resolution, and verified campus networks.</text>
  </g>

  <!-- Card 5: Open-Source Projects -->
  <g opacity="0" transform="translate(512, 197)">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.95s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="512 197" to="512 185" dur="0.5s" begin="0.95s" fill="freeze"/>
    
    <rect width="464" height="95" rx="10" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1">
      <animate attributeName="stroke-opacity" values="0.25;0.65;0.25" dur="4.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="0" y="0" width="464" height="2" fill="#38BDF8" rx="1"/>
    
    <!-- Blinking signal LED -->
    <circle cx="450" cy="14" r="2.5" fill="#38BDF8">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.7s" repeatCount="indefinite"/>
    </circle>
    
    <circle cx="28" cy="28" r="14" fill="rgba(56, 189, 248, 0.12)" stroke="#38BDF8" stroke-width="1">
      <animate attributeName="stroke-opacity" values="0.35;0.8;0.35" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="r" values="14;14.8;14" dur="3.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="24" cy="25" r="2.5" fill="none" stroke="#38BDF8" stroke-width="1.4"/>
    <circle cx="32" cy="25" r="2.5" fill="none" stroke="#38BDF8" stroke-width="1.4"/>
    <circle cx="28" cy="32" r="2.5" fill="none" stroke="#38BDF8" stroke-width="1.4"/>
    <path d="M 24 27.5 L 26.5 30 M 32 27.5 L 29.5 30" stroke="#38BDF8" stroke-width="1.2"/>
    
    <text x="50" y="27" class="sans" font-size="12.5" font-weight="700" fill="#F8FAFC">Open-Source &amp; Developer Tools</text>
    <text x="50" y="41" class="mono" font-size="9" fill="#38BDF8">// AUTOMATION SCRAPERS • CI/CD WORKFLOWS • REUSABLE PKGS</text>
    <text x="18" y="62" class="sans" font-size="10.5" fill="#CBD5E1">Building in public: opportunity scrapers, GitHub Actions workflows,</text>
    <text x="18" y="77" class="sans" font-size="10.5" fill="#CBD5E1">and modular templates to accelerate student engineering teams.</text>
  </g>
</svg>