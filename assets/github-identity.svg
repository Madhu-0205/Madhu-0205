<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 180" width="1000" height="180" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050A14"/>
      <stop offset="50%" stop-color="#07111F"/>
      <stop offset="100%" stop-color="#0B162C"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0D192E" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#081020" stop-opacity="0.95"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(56, 189, 248, 0.035)" stroke-width="1"/>
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'SF Mono', Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif; }
    .key { font-size: 9.5px; fill: #94A3B8; font-family: 'JetBrains Mono', monospace; }
    .val { font-size: 10.5px; font-weight: 600; fill: #F8FAFC; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif; }
    .val-code { font-size: 10px; font-weight: 600; fill: #38BDF8; font-family: 'JetBrains Mono', monospace; }
  </style>

  <rect width="1000" height="180" rx="14" fill="url(#bgGrad)"/>
  <rect width="1000" height="180" rx="14" fill="url(#grid)"/>
  <rect width="1000" height="180" rx="14" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1" fill="none"/>

  <!-- Section Header -->
  <text x="24" y="28" class="mono" font-size="10.5" font-weight="600" fill="#38BDF8" letter-spacing="1.5">// TELEMETRY &amp; VERIFIED CODES</text>
  <text x="24" y="48" class="sans" font-size="18" font-weight="800" fill="#F8FAFC" letter-spacing="0.5">GITHUB IDENTITY</text>
  <path d="M 24 55 L 180 55" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
  <path d="M 188 55 L 976 55" stroke="rgba(56, 189, 248, 0.15)" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Col 1: System Identity -->
  <g transform="translate(24, 65)">
    <rect width="304" height="100" rx="8" fill="url(#cardGrad)" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1"/>
    <rect x="0" y="0" width="304" height="2" fill="#38BDF8" rx="1"/>
    <text x="14" y="18" class="mono" font-size="10" font-weight="700" fill="#38BDF8">// PROFILE CODES</text>
    
    <text x="14" y="38" class="key">USERNAME :</text>
    <text x="95" y="38" class="val-code">Madhu-0205</text>
    
    <text x="14" y="56" class="key">NAME     :</text>
    <text x="95" y="56" class="val">Madhu Valurouthu</text>
    
    <text x="14" y="74" class="key">NODE_ID  :</text>
    <text x="95" y="74" class="val-code">U_kgDODPPIiw</text>
    
    <text x="14" y="91" class="key">STATUS   :</text>
    <text x="95" y="91" class="val" fill="#10B981" font-size="10">● VERIFIED BUILDER</text>
  </g>

  <!-- Col 2: Academic & Origin -->
  <g transform="translate(348, 65)">
    <rect width="304" height="100" rx="8" fill="url(#cardGrad)" stroke="rgba(99, 102, 241, 0.3)" stroke-width="1"/>
    <rect x="0" y="0" width="304" height="2" fill="#6366F1" rx="1"/>
    <text x="14" y="18" class="mono" font-size="10" font-weight="700" fill="#818CF8">// ACADEMIC &amp; LOCATION</text>
    
    <text x="14" y="38" class="key">COLLEGE  :</text>
    <text x="90" y="38" class="val">Pragati Engg College</text>
    
    <text x="14" y="56" class="key">BRANCH   :</text>
    <text x="90" y="56" class="val">CSE (Data Science)</text>
    
    <text x="14" y="74" class="key">LOCATION :</text>
    <text x="90" y="74" class="val">Kakinada, AP, India</text>
    
    <text x="14" y="91" class="key">COMPANY  :</text>
    <text x="90" y="91" class="val">CampusConnect • JobNest</text>
  </g>

  <!-- Col 3: Focus & Coordinates -->
  <g transform="translate(672, 65)">
    <rect width="304" height="100" rx="8" fill="url(#cardGrad)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1"/>
    <rect x="0" y="0" width="304" height="2" fill="#10B981" rx="1"/>
    <text x="14" y="18" class="mono" font-size="10" font-weight="700" fill="#10B981">// CORE DISCIPLINES</text>
    
    <text x="14" y="38" class="key">FOCUS 1  :</text>
    <text x="90" y="38" class="val">Data Science &amp; AI</text>
    
    <text x="14" y="56" class="key">FOCUS 2  :</text>
    <text x="90" y="56" class="val">Full-Stack Development</text>
    
    <text x="14" y="74" class="key">FOCUS 3  :</text>
    <text x="90" y="74" class="val">Spatial Indexes &amp; Open Source</text>
    
    <text x="14" y="91" class="key">EMAIL    :</text>
    <text x="90" y="91" class="val-code" font-size="9.5">madhuvalurouthu52@gmail.com</text>
  </g>
</svg>