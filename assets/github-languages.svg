<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 175" width="1000" height="175" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050A14"/>
      <stop offset="50%" stop-color="#07111F"/>
      <stop offset="100%" stop-color="#0B162C"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0D192E" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#081020" stop-opacity="0.96"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(56, 189, 248, 0.035)" stroke-width="1"/>
    </pattern>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <!-- Smooth Grow Clip Path -->
    <clipPath id="barGrowClip">
      <rect x="24" y="64" width="0" height="14" rx="7">
        <animate attributeName="width" from="0" to="952" dur="1.2s" begin="0.2s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'SF Mono', Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif; }
  </style>

  <rect width="1000" height="175" rx="14" fill="url(#bgGrad)"/>
  <rect width="1000" height="175" rx="14" fill="url(#grid)"/>
  <rect width="1000" height="175" rx="14" stroke="#38BDF8" stroke-width="1" fill="none">
    <animate attributeName="stroke-opacity" values="0.15;0.35;0.15" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- Section Header -->
  <g>
    <text x="24" y="26" class="mono" font-size="10" font-weight="600" fill="#38BDF8" letter-spacing="1.5">// VERIFIED REPOSITORY BYTE DISTRIBUTION • 9.67 MB TOTAL</text>
    <text x="24" y="46" class="sans" font-size="17" font-weight="800" fill="#F8FAFC" letter-spacing="0.5">TOP LANGUAGES</text>
    <path d="M 24 53 L 160 53" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
    <path d="M 168 53 L 976 53" stroke="rgba(56, 189, 248, 0.15)" stroke-width="1" stroke-dasharray="3 3">
      <animate attributeName="stroke-dashoffset" from="0" to="24" dur="4s" repeatCount="indefinite"/>
    </path>
    <line x1="168" y1="53" x2="300" y2="53" stroke="url(#beamGrad)" stroke-width="2">
      <animate attributeName="x1" values="168;840;168" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="300;972;300" dur="8s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Multi-Segment Progress Bar (Total width: 952px) -->
  <!-- Background trough -->
  <rect x="24" y="64" width="952" height="14" rx="7" fill="#0A1324" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1"/>
  
  <!-- Animated growing language distribution bar -->
  <g clip-path="url(#barGrowClip)">
    <!-- TypeScript: 76.41% = 727.4px -->
    <rect x="24" y="64" width="727.4" height="14" fill="#3178C6"/>
    <!-- JavaScript: 20.56% = 195.7px (x = 24 + 727.4 = 751.4) -->
    <rect x="751.4" y="64" width="195.7" height="14" fill="#F7DF1E"/>
    <!-- PLpgSQL: 1.33% = 12.7px (x = 751.4 + 195.7 = 947.1) -->
    <rect x="947.1" y="64" width="12.7" height="14" fill="#4169E1"/>
    <!-- CSS: 0.70% = 6.7px (x = 947.1 + 12.7 = 959.8) -->
    <rect x="959.8" y="64" width="6.7" height="14" fill="#563D7C"/>
    <!-- Python: 0.46% = 4.4px (x = 959.8 + 6.7 = 966.5) -->
    <rect x="966.5" y="64" width="4.4" height="14" fill="#3572A5"/>
    <!-- HTML/Shell: 0.54% = 5.1px (x = 966.5 + 4.4 = 970.9) -->
    <rect x="970.9" y="64" width="5.1" height="14" fill="#E34C26"/>
  </g>

  <!-- Legend Items (Row below bar, y=94) -->
  <!-- 1. TypeScript -->
  <g opacity="0" transform="translate(24, 102)">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.15s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="24 102" to="24 94" dur="0.4s" begin="0.15s" fill="freeze"/>

    <rect width="150" height="62" rx="7" fill="url(#cardGrad)" stroke="#3178C6" stroke-width="1">
      <animate attributeName="stroke-opacity" values="0.3;0.7;0.3" dur="3.5s" repeatCount="indefinite"/>
    </rect>
    <circle cx="16" cy="20" r="5" fill="#3178C6">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="28" y="20" class="sans" font-size="12" font-weight="700" fill="#F8FAFC">TypeScript</text>
    <text x="28" y="37" class="mono" font-size="13" font-weight="800" fill="#38BDF8" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.3s" fill="freeze"/>
      76.41%
    </text>
    <text x="28" y="51" class="mono" font-size="8.5" fill="#94A3B8">7.39 MB</text>
  </g>

  <!-- 2. JavaScript -->
  <g opacity="0" transform="translate(184, 102)">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.25s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="184 102" to="184 94" dur="0.4s" begin="0.25s" fill="freeze"/>

    <rect width="150" height="62" rx="7" fill="url(#cardGrad)" stroke="#F7DF1E" stroke-width="1">
      <animate attributeName="stroke-opacity" values="0.3;0.7;0.3" dur="3.8s" repeatCount="indefinite"/>
    </rect>
    <circle cx="16" cy="20" r="5" fill="#F7DF1E">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <text x="28" y="20" class="sans" font-size="12" font-weight="700" fill="#F8FAFC">JavaScript</text>
    <text x="28" y="37" class="mono" font-size="13" font-weight="800" fill="#F7DF1E" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.4s" fill="freeze"/>
      20.56%
    </text>
    <text x="28" y="51" class="mono" font-size="8.5" fill="#94A3B8">1.99 MB</text>
  </g>

  <!-- 3. PLpgSQL / Postgres -->
  <g opacity="0" transform="translate(344, 102)">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.35s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="344 102" to="344 94" dur="0.4s" begin="0.35s" fill="freeze"/>

    <rect width="150" height="62" rx="7" fill="url(#cardGrad)" stroke="#4169E1" stroke-width="1">
      <animate attributeName="stroke-opacity" values="0.3;0.7;0.3" dur="4.1s" repeatCount="indefinite"/>
    </rect>
    <circle cx="16" cy="20" r="5" fill="#4169E1">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="28" y="20" class="sans" font-size="12" font-weight="700" fill="#F8FAFC">PostgreSQL</text>
    <text x="28" y="37" class="mono" font-size="13" font-weight="800" fill="#60A5FA" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.5s" fill="freeze"/>
      1.33%
    </text>
    <text x="28" y="51" class="mono" font-size="8.5" fill="#94A3B8">129 KB</text>
  </g>

  <!-- 4. CSS -->
  <g opacity="0" transform="translate(504, 102)">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.45s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="504 102" to="504 94" dur="0.4s" begin="0.45s" fill="freeze"/>

    <rect width="150" height="62" rx="7" fill="url(#cardGrad)" stroke="#A78BFA" stroke-width="1">
      <animate attributeName="stroke-opacity" values="0.3;0.7;0.3" dur="3.6s" repeatCount="indefinite"/>
    </rect>
    <circle cx="16" cy="20" r="5" fill="#A78BFA">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <text x="28" y="20" class="sans" font-size="12" font-weight="700" fill="#F8FAFC">CSS3</text>
    <text x="28" y="37" class="mono" font-size="13" font-weight="800" fill="#A78BFA" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.6s" fill="freeze"/>
      0.70%
    </text>
    <text x="28" y="51" class="mono" font-size="8.5" fill="#94A3B8">67.4 KB</text>
  </g>

  <!-- 5. Python -->
  <g opacity="0" transform="translate(664, 102)">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.55s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="664 102" to="664 94" dur="0.4s" begin="0.55s" fill="freeze"/>

    <rect width="150" height="62" rx="7" fill="url(#cardGrad)" stroke="#3572A5" stroke-width="1">
      <animate attributeName="stroke-opacity" values="0.3;0.7;0.3" dur="4.4s" repeatCount="indefinite"/>
    </rect>
    <circle cx="16" cy="20" r="5" fill="#3572A5">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <text x="28" y="20" class="sans" font-size="12" font-weight="700" fill="#F8FAFC">Python</text>
    <text x="28" y="37" class="mono" font-size="13" font-weight="800" fill="#38BDF8" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.7s" fill="freeze"/>
      0.46%
    </text>
    <text x="28" y="51" class="mono" font-size="8.5" fill="#94A3B8">44.5 KB</text>
  </g>

  <!-- 6. HTML & Shell -->
  <g opacity="0" transform="translate(824, 102)">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.65s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="824 102" to="824 94" dur="0.4s" begin="0.65s" fill="freeze"/>

    <rect width="152" height="62" rx="7" fill="url(#cardGrad)" stroke="#E34C26" stroke-width="1">
      <animate attributeName="stroke-opacity" values="0.3;0.7;0.3" dur="3.9s" repeatCount="indefinite"/>
    </rect>
    <circle cx="16" cy="20" r="5" fill="#E34C26">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <text x="28" y="20" class="sans" font-size="12" font-weight="700" fill="#F8FAFC">HTML / Shell</text>
    <text x="28" y="37" class="mono" font-size="13" font-weight="800" fill="#FB923C" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.8s" fill="freeze"/>
      0.54%
    </text>
    <text x="28" y="51" class="mono" font-size="8.5" fill="#94A3B8">52.3 KB</text>
  </g>
</svg>